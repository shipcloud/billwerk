version: 2.1
jobs:
  standard:
    docker:
      - image: cimg/ruby:3.2.2
        environment:
          LANG: en_US.UTF-8
          BUNDLE_DISABLE_VERSION_CHECK: 1
    steps:
      - checkout
      - run:
          name: Install ruby dependencies
          command: gem update --system; bin/setup
      - run:
          name: Run standardrb
          command: bundle exec standardrb
  build:
    parameters:
      image-tag:
        description: The target docker image
        type: string
    docker:
      - image: cimg/<< parameters.image-tag >>
        environment:
          LANG: en_US.UTF-8
          BUNDLE_DISABLE_VERSION_CHECK: 1
    steps:
      - checkout
      - run:
          name: Install ruby dependencies
          command: gem update --system; bin/setup
      - run:
          name: Execute specs
          command: bundle exec rake

workflows:
  build:
    jobs:
      - standard
      - build:
          matrix:
            parameters:
              image-tag:
                - "ruby:3.2"
  version-check:
    jobs:
      - build:
          matrix:
            parameters:
              image-tag:
                - "ruby:3.0"
                - "ruby:3.1"
                - "ruby:3.2"
